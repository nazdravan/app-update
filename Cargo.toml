[package]
name = "app-update"
version = "0.1.0"
edition = "2024"
description = "Self-update for egui desktop apps from GitHub Releases"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nazdravan/app-update"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
egui = { version = "0.37", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
# Only the Windows binary carries the zip reader; other OSes need it for tests only.
winreg = "0.55"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = "1"
tempfile = "3"
egui_kittest = { version = "0.37", features = ["snapshot"] }
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
