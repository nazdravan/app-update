[package]
name = "app-update"
version = "0.1.0"
edition = "2024"
description = "Self-update for egui desktop apps from GitHub Releases"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nazdravan/app-update"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
